<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-label="ProofGuard separates agent planning from controlled execution"><title>ProofGuard separates agent planning from controlled execution</title><defs><marker id="arrow-black" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#111" stroke-width="1.4"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b92232" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#195bbb" stroke-width="1.4"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1120" height="420" fill="#ebebeb"/><text x="30" y="42" text-anchor="start" font-size="24" font-weight="700" fill="#111">Agent harness</text><text x="305" y="42" text-anchor="start" font-size="24" font-weight="700" fill="#111">ProofGuard foundation</text><rect x="20" y="65" width="235" height="335" fill="#ebebeb" stroke="#aaa" stroke-width="1" stroke-dasharray="7 6"/><rect x="285" y="65" width="600" height="335" fill="#ebebeb" stroke="#aaa" stroke-width="1" stroke-dasharray="7 6"/><rect x="40" y="90" width="195" height="65" fill="white" stroke="#888" stroke-width="1"/><text x="137" y="130" text-anchor="middle" font-size="21" font-weight="400" fill="#111">Context + reads</text><path d="M137 164V190" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><rect x="40" y="200" width="195" height="100" fill="white" stroke="#888" stroke-width="1"/><text x="137" y="238" text-anchor="middle" font-size="24" font-weight="700" fill="#111">pi + model</text><text x="137" y="273" text-anchor="middle" font-size="19" font-weight="400" fill="#111">proposes a plan</text><path d="M235 250H310" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><text x="270" y="322" text-anchor="middle" font-size="17" font-weight="400" fill="#111">Bend2</text><text x="270" y="348" text-anchor="middle" font-size="17" font-weight="400" fill="#111">program</text><rect x="365" y="90" width="440" height="55" fill="white" stroke="#888" stroke-width="1"/><text x="585" y="124" text-anchor="middle" font-size="21" font-weight="700" fill="#111">Owner-defined laws + permissions</text><path d="M432 145V175" fill="none" stroke="#195bbb" stroke-width="2" marker-end="url(#arrow-blue)"/><path d="M732 145V175" fill="none" stroke="#195bbb" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="310" y="175" width="245" height="130" fill="white" stroke="#888" stroke-width="1"/><text x="432" y="211" text-anchor="middle" font-size="24" font-weight="700" fill="#111">Law checker</text><text x="432" y="245" text-anchor="middle" font-size="19" font-weight="400" fill="#111">Bend + BendTT</text><text x="432" y="273" text-anchor="middle" font-size="19" font-weight="400" fill="#111">Prepare exact actions</text><path d="M555 240H610" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><rect x="610" y="175" width="245" height="130" fill="#fbedef" stroke="#b92232" stroke-width="2"/><text x="732" y="211" text-anchor="middle" font-size="24" font-weight="700" fill="#b92232">Write gateway</text><text x="732" y="245" text-anchor="middle" font-size="19" font-weight="400" fill="#111">Reserve authority</text><text x="732" y="273" text-anchor="middle" font-size="19" font-weight="400" fill="#111">Execute + record receipts</text><path d="M855 240H940" fill="none" stroke="#b92232" stroke-width="2" marker-end="url(#arrow-red)"/><rect x="940" y="195" width="160" height="90" fill="#d5d5d5" stroke="#111" stroke-width="1"/><text x="1020" y="233" text-anchor="middle" font-size="21" font-weight="700" fill="#111">Authorized</text><text x="1020" y="263" text-anchor="middle" font-size="21" font-weight="700" fill="#111">effects</text><path d="M432 305V340" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><text x="432" y="375" text-anchor="middle" font-size="19" font-weight="400" fill="#111">Rejected → no writes</text><text x="732" y="368" text-anchor="middle" font-size="17" font-weight="400" fill="#111">Only accepted actions execute</text></g></svg>
