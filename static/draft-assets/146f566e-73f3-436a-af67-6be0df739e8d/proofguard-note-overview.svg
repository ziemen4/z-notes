<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="435" viewBox="0 0 1200 435" role="img" aria-label="ProofGuard separates agent planning from controlled execution"><title>ProofGuard separates agent planning from controlled execution</title><defs><marker id="arrow-black" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#111" stroke-width="1.4"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b92232" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#195bbb" stroke-width="1.4"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#999" stroke-width="1.4"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="435" fill="#ebebeb"/><text x="30" y="42" text-anchor="start" font-size="22" font-weight="700" fill="#111">Agent harness (pi)</text><text x="360" y="42" text-anchor="start" font-size="24" font-weight="700" fill="#111">ProofGuard foundation</text><rect x="20" y="65" width="235" height="350" fill="#ebebeb" stroke="#aaa" stroke-width="1" stroke-dasharray="7 6"/><rect x="340" y="65" width="650" height="350" fill="#ebebeb" stroke="#aaa" stroke-width="1" stroke-dasharray="7 6"/><rect x="40" y="90" width="195" height="65" fill="white" stroke="#888" stroke-width="1"/><text x="137" y="130" text-anchor="middle" font-size="21" font-weight="400" fill="#111">Context + reads</text><path d="M137 164V190" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><rect x="40" y="200" width="195" height="100" fill="white" stroke="#888" stroke-width="1"/><text x="137" y="238" text-anchor="middle" font-size="24" font-weight="700" fill="#111">Model</text><text x="137" y="273" text-anchor="middle" font-size="19" font-weight="400" fill="#111">proposes a plan</text><g transform="translate(60 352)" fill="none" stroke="#555" stroke-width="1.5"><circle r="14"/><ellipse rx="6" ry="14"/><path d="M-14 0H14M-11-8H11M-11 8H11"/><path d="M-14 14L14-14" stroke="#b92232" stroke-width="3"/></g><text x="90" y="346" text-anchor="start" font-size="16" font-weight="400" fill="#111">No direct external</text><text x="90" y="371" text-anchor="start" font-size="16" font-weight="400" fill="#111">access</text><path d="M235 250H365" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><text x="300" y="230" text-anchor="middle" font-size="16" font-weight="400" fill="#111">Bend2 program</text><rect x="400" y="90" width="540" height="55" fill="white" stroke="#888" stroke-width="1"/><text x="670" y="124" text-anchor="middle" font-size="21" font-weight="700" fill="#111">Owner-defined laws + permissions</text><path d="M487 145V175" fill="none" stroke="#195bbb" stroke-width="2" marker-end="url(#arrow-blue)"/><path d="M845 145V175" fill="none" stroke="#195bbb" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="365" y="175" width="245" height="130" fill="white" stroke="#888" stroke-width="1"/><text x="487" y="211" text-anchor="middle" font-size="24" font-weight="700" fill="#111">Law checker</text><text x="487" y="245" text-anchor="middle" font-size="19" font-weight="400" fill="#111">Bend + BendTT</text><text x="487" y="273" text-anchor="middle" font-size="19" font-weight="400" fill="#111">Prepare exact actions</text><path d="M610 240H725" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><text x="667" y="221" text-anchor="middle" font-size="17" font-weight="400" fill="#111">Accepted</text><rect x="725" y="175" width="240" height="130" fill="#fbedef" stroke="#b92232" stroke-width="2"/><text x="845" y="211" text-anchor="middle" font-size="24" font-weight="700" fill="#b92232">Gateway</text><text x="845" y="245" text-anchor="middle" font-size="19" font-weight="400" fill="#111">Reserve authority</text><text x="845" y="273" text-anchor="middle" font-size="19" font-weight="400" fill="#111">Execute + record receipts</text><path d="M965 240H1040" fill="none" stroke="#b92232" stroke-width="2" marker-end="url(#arrow-red)"/><rect x="1040" y="195" width="140" height="90" fill="#d5d5d5" stroke="#111" stroke-width="1"/><text x="1110" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#111">Authorized</text><text x="1110" y="262" text-anchor="middle" font-size="20" font-weight="700" fill="#111">effects</text><path d="M487 305V350" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><text x="487" y="382" text-anchor="middle" font-size="19" font-weight="400" fill="#111">Rejected → no writes</text></g></svg>
