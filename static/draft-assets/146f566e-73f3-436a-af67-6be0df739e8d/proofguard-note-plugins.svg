<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="515" viewBox="0 0 1120 515" role="img" aria-label="Guardrails fill the checking stage of the ProofGuard foundation"><title>Guardrails fill the checking stage of the ProofGuard foundation</title><defs><marker id="arrow-black" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#111" stroke-width="1.4"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b92232" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#195bbb" stroke-width="1.4"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1120" height="515" fill="#ebebeb"/><text x="35" y="42" text-anchor="start" font-size="24" font-weight="700" fill="#111">Owner-approved guardrail plugins</text><rect x="20" y="65" width="1080" height="185" fill="#ebebeb" stroke="#aaa" stroke-width="1" stroke-dasharray="7 6"/><rect x="45" y="88" width="495" height="135" fill="white" stroke="#888" stroke-width="1"/><text x="292" y="120" text-anchor="middle" font-size="25" font-weight="700" fill="#111">Meijer</text><text x="292" y="154" text-anchor="middle" font-size="20" font-weight="400" fill="#111">Information-flow laws + workflow interpreter</text><text x="292" y="190" text-anchor="middle" font-size="18" font-weight="400" fill="#195bbb">Implemented · data_safe / flow_safe</text><rect x="580" y="88" width="495" height="135" fill="#f4f4f4" stroke="#888" stroke-width="1" stroke-dasharray="7 6"/><text x="827" y="120" text-anchor="middle" font-size="25" font-weight="700" fill="#111">CARE</text><text x="827" y="154" text-anchor="middle" font-size="20" font-weight="400" fill="#111">Shell-command analysis</text><text x="827" y="190" text-anchor="middle" font-size="18" font-weight="400" fill="#111">Possible adapter · not integrated</text><text x="35" y="326" text-anchor="start" font-size="24" font-weight="700" fill="#111">Reusable ProofGuard pipeline</text><rect x="20" y="340" width="1080" height="150" fill="#ebebeb" stroke="#aaa" stroke-width="1" stroke-dasharray="7 6"/><rect x="45" y="375" width="225" height="80" fill="white" stroke="#888" stroke-width="1"/><text x="157" y="423" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Proposed program</text><path d="M270 415H355" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/><rect x="355" y="360" width="395" height="110" fill="white" stroke="#888" stroke-width="1"/><text x="552" y="400" text-anchor="middle" font-size="24" font-weight="700" fill="#111">Apply the plugin’s checks</text><text x="552" y="436" text-anchor="middle" font-size="20" font-weight="400" fill="#111">Check laws · prepare exact actions</text><path d="M750 415H835" fill="none" stroke="#b92232" stroke-width="2" marker-end="url(#arrow-red)"/><rect x="835" y="375" width="240" height="80" fill="#fbedef" stroke="#b92232" stroke-width="2"/><text x="955" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#b92232">Write gateway</text><text x="955" y="438" text-anchor="middle" font-size="17" font-weight="400" fill="#111">Execute accepted actions</text><path d="M292 223V277H490V360" fill="none" stroke="#195bbb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="145" y="281" text-anchor="middle" font-size="18" font-weight="400" fill="#195bbb">Laws + semantics</text><path d="M827 223V277H615V360" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)" stroke-dasharray="6 5"/><text x="914" y="281" text-anchor="middle" font-size="18" font-weight="400" fill="#111">Adapter contract</text></g></svg>
